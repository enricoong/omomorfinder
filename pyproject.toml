[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omomorfinder"
version = "1.0.0"
description = "Find homomorphic / lookalike domains of a company and rank them by phishing, spoofing and competitor relevance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx[http2]>=0.27",
    "dnspython>=2.6",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "mmh3>=4.0",
    "idna>=3.6",
]

[project.optional-dependencies]
deep = [
    "opencv-python-headless>=4.9",
    "playwright>=1.45",
    "sentence-transformers>=3.0",
]

[project.scripts]
omomorfinder = "omomorfinder.cli:main"

[tool.setuptools]
packages = ["omomorfinder"]
