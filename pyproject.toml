[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omomorfinder"
# Single source of truth: omomorfinder/__init__.py (__version__)
dynamic = ["version"]
description = "Find homomorphic / lookalike domains of a company and rank them by phishing, spoofing and competitor relevance."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["phishing", "typosquatting", "homoglyph", "idn", "threat-intelligence", "red-team", "osint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx[http2]>=0.27",
    "dnspython>=2.6",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "mmh3>=4.0",
    "idna>=3.6",
]

[project.optional-dependencies]
deep = [
    "opencv-python-headless>=4.9",
    "playwright>=1.45",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
omomorfinder = "omomorfinder.cli:main"

[tool.setuptools]
packages = ["omomorfinder"]

[tool.setuptools.dynamic]
version = { attr = "omomorfinder.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]
